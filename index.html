<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Text</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0d0d0f;
      overflow: hidden;
      font-family: 'Nunito', system-ui, sans-serif;
      cursor: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 0;
    }

    #canvas { position: fixed; inset: 0; z-index: 1; }

    #hidden-input {
      position: fixed; opacity: 0;
      width: 1px; height: 1px;
      top: 0; left: 0;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      color: rgba(180,142,255,0.2);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.5s;
      text-align: center;
    }
    #hint.hidden { opacity: 0; }

    #capture-indicator {
      position: fixed;
      top: 24px; right: 28px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #capture-indicator .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #capture-indicator.on .dot {
      background: #7dff9a;
      box-shadow: 0 0 8px #7dff9a;
    }
    #capture-indicator.on .label { color: rgba(255,255,255,0.35); }
    #capture-indicator.off .dot {
      background: #ff6b6b;
      box-shadow: 0 0 8px #ff6b6b;
    }
    #capture-indicator.off .label { color: rgba(255,100,100,0.6); }

    #hotkey-overlay {
      position: fixed; inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,8,18,0.82);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    #hotkey-overlay.visible { opacity: 1; }

    #hotkey-overlay .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(180,142,255,0.2);
      border-radius: 18px;
      padding: 36px 48px;
      min-width: 340px;
      font-family: 'Nunito', sans-serif;
    }
    #hotkey-overlay h2 {
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(180,142,255,0.5);
      margin-bottom: 24px;
    }
    #hotkey-overlay table {
      border-collapse: collapse;
      width: 100%;
    }
    #hotkey-overlay tr + tr td { padding-top: 14px; }
    #hotkey-overlay td:first-child {
      padding-right: 28px;
      white-space: nowrap;
    }
    #hotkey-overlay kbd {
      display: inline-block;
      background: rgba(180,142,255,0.12);
      border: 1px solid rgba(180,142,255,0.3);
      border-radius: 6px;
      padding: 2px 9px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.82rem;
      font-weight: 800;
      color: #c0aaff;
      letter-spacing: 0.04em;
    }
    #hotkey-overlay .desc {
      font-size: 0.88rem;
      font-weight: 700;
      color: rgba(232,224,255,0.6);
    }
    #hotkey-overlay .hold-hint {
      margin-top: 22px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(180,142,255,0.28);
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <input id="hidden-input" type="text" autocomplete="off" spellcheck="false" />
  <div id="hint">Start typing&hellip;</div>

  <div id="hotkey-overlay">
    <div class="card">
      <h2>Hotkeys</h2>
      <table>
        <tr>
          <td><kbd>Enter</kbd></td>
          <td class="desc">Dissolve text immediately</td>
        </tr>
        <tr>
          <td><kbd>Shift</kbd> + <kbd>Space</kbd></td>
          <td class="desc">Toggle keyboard capture</td>
        </tr>
        <tr>
          <td><kbd>F2</kbd></td>
          <td class="desc">Toggle keyboard capture</td>
        </tr>
        <tr>
          <td><kbd>Ctrl</kbd> + <kbd>Space</kbd></td>
          <td class="desc">Hide / show status indicator</td>
        </tr>
        <tr>
          <td><kbd>Shift</kbd> + <kbd>F</kbd></td>
          <td class="desc">Enter fullscreen</td>
        </tr>
        <tr>
          <td><kbd>Escape</kbd></td>
          <td class="desc">Exit fullscreen</td>
        </tr>
      </table>
      <p class="hold-hint">Hold ` to show this panel</p>
    </div>
  </div>
  <div id="capture-indicator" class="on">
    <div class="dot"></div>
    <span class="label">Capturing</span>
  </div>

  <script>
  (() => {
    const canvas    = document.getElementById('canvas');
    const ctx       = canvas.getContext('2d');
    const input     = document.getElementById('hidden-input');
    const hint      = document.getElementById('hint');
    const indicator = document.getElementById('capture-indicator');
    const hotkeyOverlay = document.getElementById('hotkey-overlay');

    // ── input capture toggle ─────────────────────────────────────────────
    let capturing = true;
    function setCapture(on) {
      capturing = on;
      indicator.className = on ? 'on' : 'off';
      indicator.querySelector('.label').textContent = on ? 'Capturing' : 'Paused';
      if (on) input.focus(); else input.blur();
    }

    // ── resize ───────────────────────────────────────────────────────────
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // ── backtick hold → hotkey overlay ───────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.key === '`' && !e.repeat) hotkeyOverlay.classList.add('visible');
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === '`') hotkeyOverlay.classList.remove('visible');
    });

    // ── focus ────────────────────────────────────────────────────────────
    document.addEventListener('click',   () => { if (capturing) input.focus(); });
    document.addEventListener('keydown', () => { if (capturing) input.focus(); });
    window.addEventListener('load',      () => input.focus());
    input.focus();

    // ── config ───────────────────────────────────────────────────────────
    const SUBMIT_DELAY = 1800;
    const COLORS = ['#e8e0ff','#b48eff','#8a5fff','#c0aaff','#ffb3f0','#9df0e0','#ffe0b3','#b3d9ff'];
    const POP_MS = 160; // letter pop-in duration

    // ── state ────────────────────────────────────────────────────────────
    let liveText    = '';
    let submitTimer = null;
    const particles = [];

    // Per-character live display: array of { ch, x, y, size, weight, color, born }
    // Rebuilt on every keystroke, new chars get fresh `born` timestamps.
    let liveChars = [];

    // ── font size based on char count ────────────────────────────────────
    function fontSize(n) { return Math.max(32, Math.min(86, 86 - n * 1.1)); }

    // ── reflow all characters into wrapped lines ─────────────────────────
    function reflow(text, now) {
      const chars = text.split('');
      if (!chars.length) { liveChars = []; return; }

      const size   = fontSize(chars.length);
      const lineH  = size * 1.48;
      const maxW   = canvas.width * 0.84;
      const weight = '800';

      ctx.font = `${weight} ${size}px 'Nunito', sans-serif`;

      // Build lines by character, breaking at spaces when line is full
      const lines  = [];
      let line     = [], lineW = 0;

      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const cw = ctx.measureText(ch).width;
        if (lineW + cw > maxW && line.length) {
          // Try to back-track to last space for clean word wrap
          let breakAt = line.length - 1;
          while (breakAt > 0 && line[breakAt].ch !== ' ') breakAt--;
          if (breakAt > 0) {
            lines.push(line.slice(0, breakAt + 1));
            line  = line.slice(breakAt + 1);
            lineW = line.reduce((s, c) => s + c.w, 0);
          } else {
            lines.push(line);
            line  = [];
            lineW = 0;
          }
        }
        line.push({ ch, w: cw });
        lineW += cw;
      }
      if (line.length) lines.push(line);

      // Map old liveChars by index so existing chars keep their born time
      const oldByIdx = {};
      liveChars.forEach((c, i) => { oldByIdx[i] = c.born; });

      const totalH = lines.length * lineH - (lineH - size);
      const startY = canvas.height / 2 - totalH / 2 + size;

      let idx = 0;
      const next = [];
      lines.forEach((ln, li) => {
        const lw   = ln.reduce((s, c) => s + c.w, 0);
        let curX   = canvas.width / 2 - lw / 2;
        const baseY = startY + li * lineH;
        for (const { ch, w } of ln) {
          const color = ch === ' ' ? 'transparent' : COLORS[idx % COLORS.length];
          next.push({
            ch, w,
            x: curX, y: baseY,
            size, weight, color,
            born: oldByIdx[idx] !== undefined ? oldByIdx[idx] : now
          });
          curX += w;
          idx++;
        }
      });
      liveChars = next;
    }

    // ── draw live characters each frame ──────────────────────────────────
    let cursorVisible = true;
    setInterval(() => { cursorVisible = !cursorVisible; }, 530);

    function drawLive(now) {
      if (!liveText) return;

      for (const c of liveChars) {
        if (c.ch === ' ') continue;
        const age  = now - c.born;
        const t    = Math.min(age / POP_MS, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        const scale = 0.3 + ease * 0.7;
        const alpha = ease;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(c.x + c.w / 2, c.y);
        ctx.scale(scale, scale);
        ctx.font        = `${c.weight} ${c.size}px 'Nunito', sans-serif`;
        ctx.shadowColor = c.color;
        ctx.shadowBlur  = 20;
        ctx.fillStyle   = c.color;
        ctx.textAlign   = 'center';
        ctx.fillText(c.ch, 0, 0);
        ctx.restore();
      }

      // blinking cursor
      if (cursorVisible && liveChars.length) {
        const last = liveChars[liveChars.length - 1];
        const cursorX = last.x + last.w + 6;
        const cursorH = last.size * 0.82;
        ctx.save();
        ctx.shadowColor = '#b48eff';
        ctx.shadowBlur  = 14;
        ctx.fillStyle   = '#b48eff';
        ctx.globalAlpha = 0.9;
        ctx.fillRect(cursorX, last.y - cursorH, 3, cursorH);
        ctx.restore();
      }
    }

    // ── input events ─────────────────────────────────────────────────────
    input.addEventListener('input', () => {
      if (!capturing) return;
      liveText = input.value;
      reflow(liveText, performance.now());
      hint.classList.add('hidden');

      clearTimeout(submitTimer);
      if (liveText.trim()) submitTimer = setTimeout(dissolve, SUBMIT_DELAY);
    });

    input.addEventListener('keydown', (e) => {
      // toggle hotkeys work regardless of capture state
      const isToggle = (e.key === ' ' && e.shiftKey) || e.key === 'F2';
      if (isToggle) { e.preventDefault(); setCapture(!capturing); return; }

      if (e.key === ' ' && e.ctrlKey) {
        e.preventDefault();
        indicator.style.opacity = indicator.style.opacity === '0' ? '' : '0';
        return;
      }

      if (!capturing) return;

      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(submitTimer);
        if (liveText.trim()) dissolve();
      }
      if (e.key === 'F' && e.shiftKey) {
        e.preventDefault();
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      }
    });

    // catch F2 / Shift+Space even when input is blurred (paused state)
    document.addEventListener('keydown', (e) => {
      if (document.activeElement === input) return;
      const isToggle = (e.key === ' ' && e.shiftKey) || e.key === 'F2';
      if (isToggle) { e.preventDefault(); setCapture(!capturing); }
      if (e.key === ' ' && e.ctrlKey) {
        e.preventDefault();
        indicator.style.opacity = indicator.style.opacity === '0' ? '' : '0';
      }
    });

    // ── dissolve: immediately scatter each character as a leaf ───────────
    function dissolve() {
      if (!liveText.trim()) return;

      for (const c of liveChars) {
        if (c.ch === ' ') continue;
        particles.push(new LeafParticle(c.ch, c.x + c.w / 2, c.y, c.size, c.weight, c.color));
      }

      input.value = '';
      liveText    = '';
      liveChars   = [];
    }

    // ── LeafParticle — drifts and sways like an autumn leaf ──────────────
    class LeafParticle {
      constructor(ch, x, y, size, weight, color) {
        this.ch     = ch;
        this.x      = x;
        this.y      = y;
        this.size   = size * (0.75 + Math.random() * 0.35);
        this.weight = weight;
        this.color  = color;
        this.alpha  = 0.92 + Math.random() * 0.08;

        // Each leaf has a unique sway frequency and phase
        this.swayFreq  = 0.018 + Math.random() * 0.018;   // oscillation speed
        this.swayAmp   = 1.2 + Math.random() * 2.2;        // pixels per frame peak
        this.swayPhase = Math.random() * Math.PI * 2;

        // Gentle initial kick (small, random direction)
        this.vx = (Math.random() - 0.5) * 1.8;
        this.vy = -(0.3 + Math.random() * 0.8);            // slight upward puff first

        this.gravity  = 0.013 + Math.random() * 0.015;     // very slow fall
        this.maxVy    = 1.5 + Math.random() * 0.7;

        this.rotation = (Math.random() - 0.5) * 0.3;
        this.rotV     = (Math.random() - 0.5) * 0.025;     // gentle tumble
        this.rotDamp  = 0.995;

        // Slow fade — leaves linger
        this.fade    = 0.004 + Math.random() * 0.004;
        this.age     = 0;
        // Delay fade start so early letters stay crisp
        this.fadeDelay = Math.random() * 60;
      }

      update() {
        this.age++;

        // Sinusoidal sway on x
        this.x += this.vx + Math.sin(this.age * this.swayFreq + this.swayPhase) * this.swayAmp;

        // Gravity — accelerate downward up to max
        this.vy = Math.min(this.vy + this.gravity, this.maxVy);
        this.y += this.vy;

        // Horizontal drag
        this.vx *= 0.992;

        // Tumbling rotation that gradually slows
        this.rotV  *= this.rotDamp;
        this.rotation += this.rotV;

        // Fade after delay
        if (this.age > this.fadeDelay) this.alpha -= this.fade;
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font        = `${this.weight} ${this.size}px 'Nunito', sans-serif`;
        ctx.shadowColor = this.color;
        ctx.shadowBlur  = 12 + (1 - this.alpha) * 10;
        ctx.fillStyle   = this.color;
        ctx.textAlign   = 'center';
        ctx.fillText(this.ch, 0, 0);
        ctx.restore();
      }

      isDead() { return this.alpha <= 0; }
    }

    // ── render loop ──────────────────────────────────────────────────────
    function loop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawLive(now);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(now);
        p.draw();
        if (p.isDead()) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
