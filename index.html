<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Text</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0d0d0f;
      overflow: hidden;
      font-family: 'Nunito', system-ui, sans-serif;
      cursor: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 0;
    }

    #canvas { position: fixed; inset: 0; z-index: 1; }

    #hidden-input {
      position: fixed; opacity: 0;
      width: 1px; height: 1px;
      top: 0; left: 0;
      pointer-events: none;
    }

    #hint {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      color: rgba(180,142,255,0.2);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 0.5s;
      text-align: center;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <input id="hidden-input" type="text" autocomplete="off" spellcheck="false" />
  <div id="hint">Start typing&hellip;</div>

  <script>
  (() => {
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const input  = document.getElementById('hidden-input');
    const hint   = document.getElementById('hint');

    // ── resize ───────────────────────────────────────────────────────────
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // ── focus ────────────────────────────────────────────────────────────
    document.addEventListener('click',   () => input.focus());
    document.addEventListener('keydown', () => input.focus());
    window.addEventListener('load',      () => input.focus());
    input.focus();

    // ── config ───────────────────────────────────────────────────────────
    const SUBMIT_DELAY = 1800;
    const DISPLAY_HOLD = 2400;
    const COLORS = ['#e8e0ff','#b48eff','#8a5fff','#c0aaff','#ffb3f0','#9df0e0','#ffe0b3','#b3d9ff'];
    const POP_MS = 160; // letter pop-in duration

    // ── state ────────────────────────────────────────────────────────────
    let liveText    = '';
    let submitTimer = null;
    const particles = [];

    // Per-character live display: array of { ch, x, y, size, weight, color, born }
    // Rebuilt on every keystroke, new chars get fresh `born` timestamps.
    let liveChars = [];

    // ── font size based on char count ────────────────────────────────────
    function fontSize(n) { return Math.max(32, Math.min(86, 86 - n * 1.1)); }

    // ── reflow all characters into wrapped lines ─────────────────────────
    function reflow(text, now) {
      const chars = text.split('');
      if (!chars.length) { liveChars = []; return; }

      const size   = fontSize(chars.length);
      const lineH  = size * 1.48;
      const maxW   = canvas.width * 0.84;
      const weight = '800';

      ctx.font = `${weight} ${size}px 'Nunito', sans-serif`;

      // Build lines by character, breaking at spaces when line is full
      const lines  = [];
      let line     = [], lineW = 0;

      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const cw = ctx.measureText(ch).width;
        if (lineW + cw > maxW && line.length) {
          // Try to back-track to last space for clean word wrap
          let breakAt = line.length - 1;
          while (breakAt > 0 && line[breakAt].ch !== ' ') breakAt--;
          if (breakAt > 0) {
            lines.push(line.slice(0, breakAt + 1));
            line  = line.slice(breakAt + 1);
            lineW = line.reduce((s, c) => s + c.w, 0);
          } else {
            lines.push(line);
            line  = [];
            lineW = 0;
          }
        }
        line.push({ ch, w: cw });
        lineW += cw;
      }
      if (line.length) lines.push(line);

      // Map old liveChars by index so existing chars keep their born time
      const oldByIdx = {};
      liveChars.forEach((c, i) => { oldByIdx[i] = c.born; });

      const totalH = lines.length * lineH - (lineH - size);
      const startY = canvas.height / 2 - totalH / 2 + size;

      let idx = 0;
      const next = [];
      lines.forEach((ln, li) => {
        const lw   = ln.reduce((s, c) => s + c.w, 0);
        let curX   = canvas.width / 2 - lw / 2;
        const baseY = startY + li * lineH;
        for (const { ch, w } of ln) {
          const color = ch === ' ' ? 'transparent' : COLORS[idx % COLORS.length];
          next.push({
            ch, w,
            x: curX, y: baseY,
            size, weight, color,
            born: oldByIdx[idx] !== undefined ? oldByIdx[idx] : now
          });
          curX += w;
          idx++;
        }
      });
      liveChars = next;
    }

    // ── draw live characters each frame ──────────────────────────────────
    let cursorVisible = true;
    setInterval(() => { cursorVisible = !cursorVisible; }, 530);

    function drawLive(now) {
      if (!liveText) return;

      for (const c of liveChars) {
        if (c.ch === ' ') continue;
        const age  = now - c.born;
        const t    = Math.min(age / POP_MS, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        const scale = 0.3 + ease * 0.7;
        const alpha = ease;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(c.x + c.w / 2, c.y);
        ctx.scale(scale, scale);
        ctx.font        = `${c.weight} ${c.size}px 'Nunito', sans-serif`;
        ctx.shadowColor = c.color;
        ctx.shadowBlur  = 20;
        ctx.fillStyle   = c.color;
        ctx.textAlign   = 'center';
        ctx.fillText(c.ch, 0, 0);
        ctx.restore();
      }

      // blinking cursor
      if (cursorVisible && liveChars.length) {
        const last = liveChars[liveChars.length - 1];
        const cursorX = last.x + last.w + 6;
        const cursorH = last.size * 0.82;
        ctx.save();
        ctx.shadowColor = '#b48eff';
        ctx.shadowBlur  = 14;
        ctx.fillStyle   = '#b48eff';
        ctx.globalAlpha = 0.9;
        ctx.fillRect(cursorX, last.y - cursorH, 3, cursorH);
        ctx.restore();
      }
    }

    // ── input events ─────────────────────────────────────────────────────
    input.addEventListener('input', () => {
      liveText = input.value;
      reflow(liveText, performance.now());
      hint.classList.add('hidden');

      clearTimeout(submitTimer);
      if (liveText.trim()) submitTimer = setTimeout(dissolve, SUBMIT_DELAY);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(submitTimer);
        if (liveText.trim()) dissolve();
      }
      if (e.key === 'F' && e.shiftKey) {
        e.preventDefault();
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    // ── dissolve: snapshot liveChars → spawn particles by word ───────────
    function dissolve() {
      if (!liveText.trim()) return;

      // Group consecutive non-space chars into words, spawn one WordParticle each
      let wordStart = -1;
      let wordX = 0;
      const snap = liveChars;

      const flush = (endIdx) => {
        if (wordStart < 0) return;
        const slice = snap.slice(wordStart, endIdx);
        const word  = slice.map(c => c.ch).join('');
        const { x, y, size, weight, color } = slice[0];
        particles.push(new WordParticle(word, x, y, size, weight, color));
        wordStart = -1;
      };

      snap.forEach((c, i) => {
        if (c.ch === ' ') { flush(i); }
        else if (wordStart < 0) { wordStart = i; }
      });
      flush(snap.length);

      input.value = '';
      liveText    = '';
      liveChars   = [];
    }

    // ── WordParticle ─────────────────────────────────────────────────────
    class WordParticle {
      constructor(word, x, y, size, weight, color) {
        this.word   = word;
        this.x      = x; this.y = y;
        this.size   = size;
        this.weight = weight;
        this.color  = color;

        this.alpha    = 1;
        this.scale    = 1;
        this.rotation = 0;
        this.phase    = 'hold';
        this.born     = performance.now();

        this.explodeVX = (Math.random() - 0.5) * 3;
        this.explodeVY = (Math.random() - 0.5) * 3 - 1.5;
        this.letterParticles = [];
      }

      update(now) {
        if (this.phase === 'hold') {
          const held = now - this.born;
          this.scale = 1.02 + Math.sin(held / 400 + this.x) * 0.018;
          if (held >= DISPLAY_HOLD) {
            this.phase = 'out';
            this.spawnLetterParticles();
          }
        } else {
          this.alpha     -= 0.032;
          this.x         += this.explodeVX;
          this.y         += this.explodeVY;
          this.explodeVY -= 0.05;
          this.scale     += 0.012;
          this.rotation  += (Math.random() - 0.5) * 0.04;
          for (const lp of this.letterParticles) lp.update();
        }
      }

      spawnLetterParticles() {
        ctx.font = `${this.weight} ${this.size}px 'Nunito', sans-serif`;
        let ox = this.x;
        for (const ch of this.word.split('')) {
          const cw = ctx.measureText(ch).width;
          this.letterParticles.push(new LetterParticle(ch, ox + cw / 2, this.y, this.size, this.weight, this.color));
          ox += cw;
        }
      }

      draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);
        ctx.rotate(this.rotation);
        ctx.font        = `${this.weight} ${this.size}px 'Nunito', sans-serif`;
        ctx.shadowColor = this.color;
        ctx.shadowBlur  = 22 + (1 - this.alpha) * 20;
        ctx.fillStyle   = this.color;
        ctx.fillText(this.word, 0, 0);
        if (this.phase === 'hold') {
          ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha)) * 0.3;
          ctx.shadowBlur  = 48;
          ctx.fillText(this.word, 0, 0);
        }
        ctx.restore();
        for (const lp of this.letterParticles) lp.draw();
      }

      isDead() { return this.alpha <= 0 && this.phase === 'out'; }
    }

    // ── LetterParticle ───────────────────────────────────────────────────
    class LetterParticle {
      constructor(ch, x, y, size, weight, color) {
        this.ch     = ch; this.x = x; this.y = y;
        this.size   = size * (0.4 + Math.random() * 0.5);
        this.weight = weight; this.color = color;
        this.alpha  = 0.7 + Math.random() * 0.3;
        this.vx     = (Math.random() - 0.5) * 6;
        this.vy     = (Math.random() - 0.5) * 6 - 2;
        this.gravity = 0.12 + Math.random() * 0.1;
        this.rotation = (Math.random() - 0.5) * 0.4;
        this.rotV  = (Math.random() - 0.5) * 0.08;
        this.fade  = 0.016 + Math.random() * 0.012;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += this.gravity; this.vx *= 0.98;
        this.rotation += this.rotV; this.alpha -= this.fade;
      }
      draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.font      = `${this.weight} ${this.size}px 'Nunito', sans-serif`;
        ctx.shadowColor = this.color; ctx.shadowBlur = 10;
        ctx.fillStyle = this.color;
        ctx.textAlign = 'center';
        ctx.fillText(this.ch, 0, 0);
        ctx.restore();
      }
    }

    // ── render loop ──────────────────────────────────────────────────────
    function loop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawLive(now);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(now);
        p.draw();
        if (p.isDead()) particles.splice(i, 1);
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
